# Releases with release-please:
#   1. every push to main updates a "Release PR" (version bump + CHANGELOG)
#   2. merging that PR tags vX.Y.Z and creates the GitHub release
#   3. then the app is built (tarball, deb, rpm) and attached to the release
#   4. and the AUR packages are updated (only if the AUR secrets are set)
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          # A personal token lets the Release PR trigger CI; GITHUB_TOKEN
          # works too, but then CI does not run on that PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    # Older base system = binary and .deb run on more distributions
    runs-on: ubuntu-22.04
    env:
      CARGO_TERM_COLOR: always
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev build-essential file rpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Build (binary, deb, rpm)
        run: npx tauri build --bundles deb,rpm
      - name: Package
        run: packaging/make-tarball.sh "${VERSION}"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" dist-release/* --clobber

  aur:
    needs: [release-please, build]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    env:
      HAS_AUR: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    strategy:
      matrix:
        package: [svcdeck, svcdeck-bin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - name: Skip without AUR credentials
        if: env.HAS_AUR != 'true'
        run: echo "::notice::AUR_SSH_PRIVATE_KEY not set, ${{ matrix.package }} not published"
      - name: Publish ${{ matrix.package }}
        if: env.HAS_AUR == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: packaging/aur/${{ matrix.package }}/PKGBUILD
          assets: packaging/aur/${{ matrix.package }}/svcdeck.install
          updpkgsums: true
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.release-please.outputs.version }}
