[package]
name = "svcdeck"
version = "0.1.0"
description = "Start, stop and open the services you would otherwise control from a terminal"
authors = ["BL4ZE"]
license = "GPL-3.0-or-later"
repository = "https://github.com/bl4z3-0o/svcdeck"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2"
base64 = "0.22"

[profile.release]
# Kleines Binary, der Starter braucht keine Debug-Infos
codegen-units = 1
lto = true
opt-level = "s"
strip = true
